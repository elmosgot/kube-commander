        namespace: app
        azure:
          subscription: 00000000-0000-0000-0000-000000000013
          resource_group: rg-pool-y-acc
          cluster: aks-pool-y-acc
      - name: production
        context: pool-y-prod
        namespace: app
        azure:
          subscription: 00000000-0000-0000-0000-000000000014
          resource_group: rg-pool-y-prod
          cluster: aks-pool-y-prod
